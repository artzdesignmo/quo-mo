<!DOCTYPE html>
<html lang="zh-Hant" data-theme="silver">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quo-mo — 澳門商業單據工作室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8e8e6; --panel:#f7f7f5; --card:#ffffff; --ink:#1c1c1e; --ink2:#6b6b6e;
  --line:#d8d8d4; --accent:#b8860b; --radius:14px;
}
[data-theme="white"]{ --bg:#f4f4f4; --panel:#ffffff; --card:#ffffff; --ink:#1c1c1e; --ink2:#6b6b6e; --line:#e2e2e2; }
[data-theme="black"]{ --bg:#141414; --panel:#1e1e1e; --card:#242424; --ink:#f2f2f2; --ink2:#a8a8a8; --line:#333; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:'Noto Sans TC','Noto Sans',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
h1,h2,.dela{ font-family:'Dela Gothic One',sans-serif; font-weight:400; }
/* ---------- top bar ---------- */
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 22px; position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--line); }
.brand .t{ font-family:'Dela Gothic One'; font-size:22px; letter-spacing:1px; }
.brand .s{ font-size:11px; color:var(--ink2); letter-spacing:3px; margin-top:2px; }
.hctl{ display:flex; align-items:center; gap:10px; }
.seg{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:var(--card); }
.seg button{ border:0; background:transparent; color:var(--ink2); padding:7px 13px; cursor:pointer; font-size:12px; font-weight:500; }
.seg button.on{ background:var(--ink); color:var(--bg); }
.tbtn{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); cursor:pointer; background:var(--card); font-size:14px; }
/* ---------- layout ---------- */
.work{ display:grid; grid-template-columns:340px 1fr; gap:18px; padding:18px 22px 40px; max-width:1500px; margin:0 auto; align-items:start; }
@media (max-width:980px){ .work{ grid-template-columns:1fr; } }
/* ---------- mobile tabs ---------- */
.mtabs{ display:none; }
@media (max-width:768px){
  .topbar{ padding:10px 14px; }
  .brand .t{ font-size:18px; }
  .mtabs{ display:flex; gap:8px; padding:10px 14px; position:sticky; top:57px; z-index:40; background:var(--bg); border-bottom:1px solid var(--line); }
  .mtabs button{ flex:1; padding:11px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink2); font-size:15px; font-weight:600; cursor:pointer; }
  .mtabs button.on{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .work{ display:block; padding:12px 12px 40px; }
  .work[data-mtab="tpl"] .editor,
  .work[data-mtab="tpl"] .toolbar-tools,
  .work[data-mtab="tpl"] .toolbar-export,
  .work[data-mtab="tpl"] .pvwrap{ display:none; }
  .work[data-mtab="edit"] .tstrip,
  .work[data-mtab="edit"] .toolbar-export,
  .work[data-mtab="edit"] .pvwrap{ display:none; }
  .work[data-mtab="preview"] .editor,
  .work[data-mtab="preview"] .tstrip,
  .work[data-mtab="preview"] .toolbar-tools{ display:none; }
  .editor{ position:static; max-height:none; }
  .tstrip{ display:grid !important; grid-template-columns:1fr 1fr; gap:12px; overflow:visible; }
  .tplcard{ width:auto; }
  .tplcard .thumb{ height:210px; }
  .tplcard .thumb .doc{ transform:scale(.24); }
  .tplcard .nm{ font-size:13px; padding:8px 4px; }
  .toolbar{ justify-content:flex-start; }
  .frow input, .frow textarea, .frow select{ font-size:16px; padding:10px 12px; }
  .btn{ padding:11px 18px; font-size:15px; }
}
/* ---------- editor panel ---------- */
.editor{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; position:sticky; top:76px; max-height:calc(100vh - 100px); overflow-y:auto; }
.editor h3{ font-size:13px; letter-spacing:2px; margin:18px 0 10px; color:var(--ink2); font-family:'Noto Sans TC'; font-weight:700; }
.editor h3:first-child{ margin-top:0; }
.frow{ margin-bottom:9px; }
.frow label{ display:block; font-size:11px; color:var(--ink2); margin-bottom:3px; }
.frow input, .frow textarea, .frow select{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--ink); font-size:13px; font-family:inherit; }
.frow textarea{ resize:vertical; min-height:56px; }
.f2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.f3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.btn{ display:inline-block; padding:9px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; font-size:13px; font-weight:500; }
.btn.primary{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
.btn.small{ padding:6px 10px; font-size:12px; }
.btnrow{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.itemrow{ border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; background:var(--card); position:relative; }
.itemrow .del{ position:absolute; top:8px; right:8px; border:0; background:transparent; color:#c0392b; cursor:pointer; font-size:16px; }
/* ---------- template strip ---------- */
.tstrip{ display:flex; gap:10px; overflow-x:auto; padding:4px 2px 12px; margin-bottom:6px; }
.tplcard{ flex:0 0 108px; cursor:pointer; border:2px solid transparent; border-radius:10px; overflow:hidden; background:var(--card); transition:.15s; }
.tplcard.on{ border-color:var(--ink); }
.tplcard .thumb{ height:132px; overflow:hidden; position:relative; background:#fff; }
.tplcard .thumb .doc{ transform:scale(.135); transform-origin:top left; width:794px; }
.tplcard .nm{ font-size:11px; text-align:center; padding:6px 2px; color:var(--ink2); }
/* ---------- preview ---------- */
.stage{ display:flex; flex-direction:column; align-items:center; }
.toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; margin-bottom:14px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; }
.toolbar .lbl{ font-size:12px; color:var(--ink2); }
.pvwrap{ width:100%; max-width:820px; }
.pvscale{ transform-origin:top center; }
.sheet{ width:794px; background:#fff; box-shadow:0 10px 40px rgba(0,0,0,.14); border-radius:4px; overflow:hidden; }
/* ================= DOC (A4 794x1123) ================= */
.doc{ width:794px; min-height:1123px; background:#fff; color:#222; font-size:13px; line-height:1.55; padding:56px 60px; position:relative; font-family:'Noto Sans TC','Noto Sans',Arial,sans-serif; display:flex; flex-direction:column; }
.doc *{ box-sizing:border-box; }
.d-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin-bottom:8px; }
.seller{ display:flex; gap:16px; align-items:flex-start; }
.logo-box{ width:84px; height:84px; border:1.5px dashed #bbb; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#aaa; font-size:10px; text-align:center; overflow:hidden; flex:0 0 84px; }
.logo-box img{ width:100%; height:100%; object-fit:contain; }
.seller-name{ font-size:21px; font-weight:700; line-height:1.3; }
.seller-contact{ font-size:11.5px; color:#555; margin-top:6px; line-height:1.7; white-space:pre-line; }
.d-meta{ text-align:right; min-width:230px; }
.doc-type{ font-size:26px; font-weight:700; letter-spacing:2px; margin-bottom:10px; }
.meta-table{ width:100%; font-size:12px; border-collapse:collapse; }
.meta-table td{ padding:3px 0; vertical-align:top; }
.meta-table td.k{ color:#777; text-align:left; padding-right:10px; white-space:nowrap; }
.meta-table td.v{ text-align:right; font-weight:500; }
.d-rule{ border:0; border-top:2px solid #222; margin:14px 0 18px; }
.billto{ margin-bottom:16px; }
.billto .cap{ font-size:11px; letter-spacing:2px; color:#888; margin-bottom:6px; font-weight:700; }
.billto .co{ font-size:15px; font-weight:700; }
.billto .ct{ font-size:12px; color:#555; margin-top:3px; }
table.items{ width:100%; border-collapse:collapse; margin:6px 0 0; font-size:12.5px; }
table.items th{ text-align:left; padding:9px 8px; font-size:11px; letter-spacing:1px; border-bottom:2px solid #222; white-space:nowrap; }
table.items td{ padding:9px 8px; border-bottom:1px solid #e3e3e3; vertical-align:top; }
table.items td.n, table.items th.n{ text-align:center; width:38px; }
table.items td.q, table.items th.q{ text-align:center; width:64px; }
table.items td.p, table.items th.p, table.items td.a, table.items th.a{ text-align:right; white-space:nowrap; }
.d-totals{ display:flex; justify-content:flex-end; margin-top:14px; }
.tot-box{ min-width:270px; }
.tot-row{ display:flex; justify-content:space-between; padding:5px 0; font-size:13px; }
.tot-row.grand{ border-top:2px solid #222; margin-top:6px; padding-top:9px; font-size:17px; font-weight:700; }
.words{ font-size:11.5px; color:#555; margin-top:8px; text-align:right; font-style:italic; }
.d-pay{ margin-top:20px; font-size:12px; }
.d-pay .cap, .d-rmk .cap{ font-size:11px; letter-spacing:2px; color:#888; margin-bottom:6px; font-weight:700; }
.d-pay .ln{ margin:2px 0; }
.d-rmk{ margin-top:16px; font-size:12px; }
.d-rmk .tx{ white-space:pre-line; color:#444; }
.d-sign{ margin-top:auto; padding-top:34px; display:flex; justify-content:space-between; gap:30px; }
.sign-box{ flex:1; }
.sign-line{ border-top:1px solid #333; margin-top:64px; padding-top:6px; font-size:11px; color:#666; text-align:center; }
.chop{ width:110px; height:110px; border:2px solid #c0392b; border-radius:6px; color:#c0392b; display:flex; align-items:center; justify-content:center; font-size:12px; opacity:.55; margin:0 auto; transform:rotate(-6deg); }
.d-foot{ margin-top:26px; padding-top:10px; border-top:1px solid #ddd; font-size:10px; color:#999; text-align:center; }
/* ---------- 12 template themes ---------- */
.doc.tpl1{ --ac:#1a3a5c; }
.doc.tpl1 .doc-type{ color:var(--ac); }
.doc.tpl1 .d-rule{ border-color:var(--ac); }
.doc.tpl1 table.items th{ background:var(--ac); color:#fff; border:0; }
.doc.tpl1 .tot-row.grand{ color:var(--ac); border-color:var(--ac); }
.doc.tpl1 .seller-name{ color:var(--ac); font-family:Georgia,serif; }
.doc.tpl2{ --ac:#111; }
.doc.tpl2{ padding:64px 70px; }
.doc.tpl2 .doc-type{ font-weight:400; letter-spacing:8px; font-size:22px; }
.doc.tpl2 table.items th{ border-bottom:1px solid #111; font-weight:400; text-transform:uppercase; letter-spacing:2px; }
.doc.tpl2 table.items td{ border-bottom:1px dotted #ccc; }
.doc.tpl2 .d-rule{ border-top:1px solid #111; }
.doc.tpl2 .tot-row.grand{ border-top:1px solid #111; }
.doc.tpl3{ --ac:#0e7c7b; --ac2:#f4762b; padding:0; }
.doc.tpl3 .band{ height:22px; background:linear-gradient(90deg,var(--ac) 0 55%,var(--ac2) 55% 100%); }
.doc.tpl3 .inner{ padding:44px 60px 56px; display:flex; flex-direction:column; flex:1; }
.doc.tpl3 .doc-type{ color:var(--ac); }
.doc.tpl3 table.items th{ background:var(--ac); color:#fff; border:0; }
.doc.tpl3 .tot-row.grand{ color:var(--ac2); border-color:var(--ac2); }
.doc.tpl4{ --ac:#a8842c; }
.doc.tpl4 .doc-type{ color:var(--ac); font-family:Georgia,serif; letter-spacing:4px; }
.doc.tpl4 .d-rule{ border-top:3px double var(--ac); }
.doc.tpl4 table.items th{ border-bottom:2px solid var(--ac); color:var(--ac); }
.doc.tpl4 .tot-row.grand{ color:var(--ac); border-color:var(--ac); }
.doc.tpl4 .seller-name{ font-family:Georgia,serif; }
.doc.tpl5{ --ac:#0b5fa5; }
.doc.tpl5 .d-head{ background:var(--ac); margin:-56px -60px 0; padding:40px 60px 26px; color:#fff; }
.doc.tpl5 .seller-contact{ color:#dcebf7; }
.doc.tpl5 .doc-type{ color:#fff; }
.doc.tpl5 .meta-table td.k{ color:#bcd7ec; }
.doc.tpl5 table.items tr:nth-child(even) td{ background:#f2f7fc; }
.doc.tpl5 table.items th{ color:var(--ac); border-bottom:2px solid var(--ac); }
.doc.tpl5 .tot-row.grand{ color:var(--ac); border-color:var(--ac); }
.doc.tpl6{ --ac:#333; font-family:'Courier New',monospace; }
.doc.tpl6 table.items th, .doc.tpl6 table.items td{ border:1px solid #999; }
.doc.tpl6 table.items th{ background:#eee; }
.doc.tpl6 .d-rule{ border-top:2px dashed #333; }
.doc.tpl6 .doc-type{ letter-spacing:0; }
.doc.tpl7{ --ac:#5b8dd9; }
.doc.tpl7 .doc{ border-radius:0; }
.doc.tpl7 .d-head{ background:#eef4fc; border-radius:16px; padding:26px 30px; }
.doc.tpl7 table.items th{ background:var(--ac); color:#fff; border:0; border-radius:0; }
.doc.tpl7 table.items tr td:first-child{ border-radius:0; }
.doc.tpl7 .tot-box{ background:#f6f9fe; border-radius:12px; padding:12px 18px; }
.doc.tpl7 .tot-row.grand{ color:var(--ac); border-color:var(--ac); }
.doc.tpl8{ --ac:#c9a24b; }
.doc.tpl8 .d-head{ background:#191919; margin:-56px -60px 0; padding:44px 60px 30px; color:#f5f5f5; }
.doc.tpl8 .seller-contact{ color:#bdbdbd; }
.doc.tpl8 .doc-type{ color:var(--ac); }
.doc.tpl8 .meta-table td.k{ color:#8f8f8f; }
.doc.tpl8 table.items th{ border-bottom:2px solid var(--ac); color:var(--ac); }
.doc.tpl8 .tot-row.grand{ color:var(--ac); border-color:var(--ac); }
.doc.tpl9{ --ac:#1f5fa8; }
.doc.tpl9 .tile{ height:26px; margin:-56px -60px 26px;
  background:
   repeating-linear-gradient(45deg, var(--ac) 0 10px, #fff 10px 20px),
   repeating-linear-gradient(-45deg, var(--ac) 0 10px, #fff 10px 20px);
  background-blend-mode:multiply; opacity:.9; }
.doc.tpl9 .doc-type{ color:var(--ac); }
.doc.tpl9 table.items th{ background:var(--ac); color:#fff; border:0; }
.doc.tpl9 .d-rule{ border-color:var(--ac); }
.doc.tpl9 .tot-row.grand{ color:var(--ac); border-color:var(--ac); }
.doc.tpl9 .d-foot{ border-top:3px double var(--ac); }
.doc.tpl10{ --ac:#444; font-size:12px; padding:44px 50px; }
.doc.tpl10 .d-head{ margin-bottom:2px; }
.doc.tpl10 .doc-type{ font-size:20px; }
.doc.tpl10 table.items th, .doc.tpl10 table.items td{ padding:6px 6px; }
.doc.tpl10 .d-meta{ min-width:200px; }
.doc.tpl10 .tot-row.grand{ font-size:15px; }
.doc.tpl11{ --ac:#e0653a; }
.doc.tpl11 .d-head{ align-items:center; }
.doc.tpl11 .doc-type{ font-size:40px; color:var(--ac); line-height:1.1; }
.doc.tpl11 .seller-name{ font-size:26px; }
.doc.tpl11 table.items th{ border-bottom:3px solid var(--ac); color:var(--ac); font-size:13px; }
.doc.tpl11 .tot-row.grand{ color:var(--ac); border-color:var(--ac); font-size:20px; }
.doc.tpl11 .d-rule{ border:0; }
.doc.tpl12{ --ac:#8c1d18; }
.doc.tpl12 .d-head{ flex-direction:column; align-items:center; text-align:center; }
.doc.tpl12 .seller{ flex-direction:column; align-items:center; }
.doc.tpl12 .doc-type{ font-size:30px; color:var(--ac); margin-top:6px; }
.doc.tpl12 .d-meta{ text-align:center; }
.doc.tpl12 .meta-table td.k{ text-align:right; } .doc.tpl12 .meta-table td.v{ text-align:left; }
.doc.tpl12 .d-rule{ border-top:3px double var(--ac); }
.doc.tpl12 table.items th{ border-top:2px solid var(--ac); border-bottom:2px solid var(--ac); color:var(--ac); }
/* print */
@media print{
  body{ background:#fff; }
  .topbar,.editor,.toolbar,.tstrip,.hctl{ display:none !important; }
  .work{ display:block; padding:0; max-width:none; }
  .pvwrap{ max-width:none; }
  .pvscale{ transform:none !important; }
  .sheet{ box-shadow:none; border-radius:0; }
  @page{ size:A4; margin:0; }
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="t">QUO-MO</div><div class="s">MACAU BUSINESS DOCS</div></div>
  <div class="hctl">
    <div class="seg" id="uiLang"><button data-l="zh" class="on">中</button><button data-l="en">EN</button></div>
    <button class="tbtn" data-th="white" title="white" style="background:#fff"></button>
    <button class="tbtn" data-th="silver" title="silver" style="background:#d8d8d8"></button>
    <button class="tbtn" data-th="black" title="black" style="background:#222"></button>
  </div>
</div>
<div class="mtabs" id="mtabs">
  <button data-mtab="tpl" class="on">模板</button>
  <button data-mtab="edit">編輯</button>
  <button data-mtab="preview">預覽</button>
</div>
<div class="work" data-mtab="tpl">
  <div class="editor" id="editor"></div>
  <div class="stage">
    <div class="toolbar toolbar-tools">
      <span class="lbl" data-i="doct">單據</span>
      <div class="seg" id="docType"><button data-v="quotation" class="on">報價單</button><button data-v="invoice">發票</button><button data-v="receipt">收據</button></div>
      <span class="lbl" data-i="langm">語言</span>
      <div class="seg" id="docLang"><button data-v="both" class="on">雙語</button><button data-v="zh">中文</button><button data-v="en">EN</button></div>
    </div>
    <div class="tstrip" id="tstrip"></div>
    <div class="toolbar toolbar-export">
      <button class="btn primary" id="bPng">PNG</button>
      <button class="btn" id="bJpg">JPG</button>
      <button class="btn" id="bPdf">PDF</button>
      <button class="btn" id="bSave" data-i="save">儲存檔案</button>
      <button class="btn" id="bLoad" data-i="load">讀取檔案</button>
      <input type="file" id="fLoad" accept=".json" style="display:none">
    </div>
    <div class="pvwrap"><div class="pvscale" id="pvscale"><div class="sheet"><div id="preview"></div></div></div></div>
  </div>
</div>
<script>
/* ================= Quo-mo ================= */
const $=id=>document.getElementById(id);
/* ---- app UI language (default zh) ---- */
const UI={
 zh:{doct:'單據',langm:'語言',save:'儲存檔案',load:'讀取檔案',seller:'賣方資訊',meta:'單據資訊',client:'客戶資訊',items:'明細項目',total:'金額',pay:'支付資訊',rmk:'備註及簽署',add:'＋ 新增項目',logo:'上載 Logo',clear:'清除'},
 en:{doct:'Document',langm:'Language',save:'Save file',load:'Load file',seller:'Seller info',meta:'Document info',client:'Bill to',items:'Line items',total:'Totals',pay:'Payment',rmk:'Notes & signature',add:'+ Add item',logo:'Upload logo',clear:'Clear'}
};
let uiLang=localStorage.getItem('quomo-ui')||'zh';
const T=k=>(UI[uiLang]&&UI[uiLang][k])||UI.zh[k]||k;
/* ---- theme ---- */
let theme=localStorage.getItem('quomo-theme')||'silver';
function applyTheme(){document.documentElement.dataset.theme=theme;try{localStorage.setItem('quomo-theme',theme)}catch(e){}}
document.querySelectorAll('.tbtn').forEach(b=>b.onclick=()=>{theme=b.dataset.th;applyTheme();});
document.querySelectorAll('#uiLang button').forEach(b=>b.onclick=()=>{uiLang=b.dataset.l;try{localStorage.setItem('quomo-ui',uiLang)}catch(e){}buildChrome();buildEditor();render();});
function buildChrome(){
  document.querySelectorAll('#uiLang button').forEach(b=>b.classList.toggle('on',b.dataset.l===uiLang));
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=T(el.dataset.i));
  const dt={quotation:uiLang==='zh'?'報價單':'Quotation',invoice:uiLang==='zh'?'發票':'Invoice',receipt:uiLang==='zh'?'收據':'Receipt'};
  document.querySelectorAll('#docType button').forEach(b=>b.textContent=dt[b.dataset.v]);
  const dl={both:uiLang==='zh'?'雙語':'Bilingual',zh:'中文',en:'EN'};
  document.querySelectorAll('#docLang button').forEach(b=>b.textContent=dl[b.dataset.v]);
}
/* ---- doc language labels ---- */
const LB={
 no:{zh:'項次',en:'No.'}, desc:{zh:'項目名稱及描述',en:'Description'}, qty:{zh:'數量',en:'Qty'},
 price:{zh:'單價 (MOP)',en:'Unit Price (MOP)'}, disc:{zh:'折扣',en:'Discount'}, amt:{zh:'金額',en:'Amount'},
 billto:{zh:'客戶',en:'Bill To'}, contact:{zh:'聯絡人',en:'Contact'}, phone:{zh:'電話',en:'Tel'}, email:{zh:'電郵',en:'Email'},
 total:{zh:'總金額',en:'Total Amount'}, words:{zh:'大寫',en:'Amount in Words'},
 pay:{zh:'支付資訊',en:'Payment Info'}, bank:{zh:'銀行',en:'Bank'}, accname:{zh:'帳戶名稱',en:'Account Name'},
 accno:{zh:'帳號',en:'Account No.'}, cheque:{zh:'支票抬頭',en:'Cheque Payable To'},
 rmk:{zh:'備註',en:'Remarks'}, sign:{zh:'授權簽署及公司蓋章',en:'Authorized Signature & Company Chop'},
 seller:{zh:'授權代表',en:'For and on behalf of'}, date:{zh:'日期',en:'Date'}, validity:{zh:'有效期至',en:'Valid Until'},
};
const L=k=>{const m=doc.lang;if(m==='zh')return LB[k].zh;if(m==='en')return LB[k].en;return LB[k].zh+' '+LB[k].en;};
const DOCNAME={quotation:{zh:'報價單',en:'QUOTATION'},invoice:{zh:'發票',en:'INVOICE'},receipt:{zh:'收據',en:'RECEIPT'}};
const docName=()=>{const d=DOCNAME[doc.type];return doc.lang==='zh'?d.zh:doc.lang==='en'?d.en:d.en+' '+d.zh;};
/* ---- templates ---- */
const TPLS=[
 {n:'經典深藍 Classic',c:1},{n:'極簡 Minimal',c:2},{n:'活力色帶 Stripe',c:3},{n:'典雅金 Gold',c:4},
 {n:'企業藍 Corporate',c:5},{n:'網格 Grid',c:6},{n:'柔和 Soft',c:7},{n:'暗黑 Noir',c:8},
 {n:'葡式花磚 Azulejo',c:9},{n:'緊湊 Compact',c:10},{n:'創意 Studio',c:11},{n:'正式公函 Formal',c:12},
];
/* ---- doc model ---- */
const today=()=>new Date().toISOString().slice(0,10);
function blankDoc(){return{
 type:'quotation',lang:'both',tpl:1,
 seller:{name_zh:'澳門創意設計有限公司',name_en:'Macau Creative Design Ltd.',addr:'澳門新口岸皇朝區商務中心 18 樓',phone:'(853) 2888 0000',email:'info@example.mo',logo:''},
 meta:{no:'Q-2026-001',date:today(),validity:''},
 client:{co:'',contact:'',phone:'',email:''},
 items:[{d:'',q:1,p:0,disc:0},{d:'',q:1,p:0,disc:0},{d:'',q:1,p:0,disc:0}],
 showWords:true, showPay:true, showChop:true,
 pay:{bank:'中國銀行澳門分行',accname:'',accno:'',cheque:''},
 rmk:'', signName:'',
};}
let doc=blankDoc();
try{const d=localStorage.getItem('quomo-draft');if(d)doc=Object.assign(blankDoc(),JSON.parse(d));}catch(e){}
const saveDraft=()=>{try{localStorage.setItem('quomo-draft',JSON.stringify(doc))}catch(e){}};
const money=n=>'MOP '+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const lineAmt=it=>it.q*it.p*(1-(it.disc||0)/100);
const grandTotal=()=>doc.items.reduce((a,it)=>a+lineAmt(it),0);
/* ---- amount in words ---- */
function enWords(n){
 const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
 const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
 const two=x=>x<20?a[x]:b[Math.floor(x/10)]+(x%10?'-'+a[x%10]:'');
 const three=x=>{const h=Math.floor(x/100),r=x%100;return (h?a[h]+' Hundred':'')+(h&&r?' ':'')+(r?two(r):'');};
 n=Math.round(n*100)/100; const ip=Math.floor(n), cp=Math.round((n-ip)*100);
 let s='';
 const m=Math.floor(ip/1e6), t=Math.floor(ip%1e6/1e3), r=ip%1e3;
 if(m)s+=three(m)+' Million '; if(t)s+=three(t)+' Thousand '; s+=three(r)||'Zero';
 s=s.trim()+' Dollars'; if(cp)s+=' and '+two(cp)+' Cents';
 return 'MOP '+s;
}
function zhWords(n){
 const d='零壹貳叁肆伍陸柒捌玖', u=['','拾','佰','仟'], g=['','萬','億'];
 n=Math.round(n*100)/100; const ip=Math.floor(n), cp=Math.round((n-ip)*100);
 let s=ip===0?'零':''; const str=String(ip); const len=str.length;
 for(let i=0;i<len;i++){const dg=+str[i],pos=len-1-i,uu=u[pos%4],gg=pos%4===0?g[pos/4]:'';
  if(dg===0){if(s.slice(-1)!=='零'&&pos%4!==0)s+='零';}else s+=d[dg]+uu;
  if(pos%4===0&&pos>0){s=s.replace(/零+$/,'');s+=gg;}}
 s=s.replace(/零+/g,'零').replace(/零$/,'')||'零'; s+='元';
 if(cp){const j=Math.floor(cp/10),f=cp%10;s+=(j?d[j]+'角':'')+(f?d[f]+'分':'');}else s+='整';
 return '澳門幣 '+s;
}
const amtWords=()=>{const t=grandTotal();return doc.lang==='en'?enWords(t):doc.lang==='zh'?zhWords(t):zhWords(t)+'<br>'+enWords(t);};
/* ================= render doc ================= */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
function renderDoc(){
 const c=doc.tpl, s=doc.seller, m=doc.meta;
 const sellerName=doc.lang==='en'?esc(s.name_en):doc.lang==='zh'?esc(s.name_zh):esc(s.name_zh)+'<br>'+esc(s.name_en);
 const contact=[esc(s.addr),'T: '+esc(s.phone),esc(s.email)].filter(x=>x&&x!=='T: ').join('<br>');
 const band=c===3?'<div class="band"></div>':'';
 const tile=c===9?'<div class="tile"></div>':'';
 const inner=
  (c===3?band:tile)+
  '<div class="d-head"><div class="seller"><div class="logo-box">'+(s.logo?'<img src="'+s.logo+'">':'LOGO')+'</div>'+
  '<div><div class="seller-name">'+sellerName+'</div><div class="seller-contact">'+contact+'</div></div></div>'+
  '<div class="d-meta"><div class="doc-type">'+docName()+'</div><table class="meta-table">'+
  '<tr><td class="k">'+(doc.lang==='zh'?'單據編號':doc.lang==='en'?'No.':'單據編號 No.')+'</td><td class="v">'+esc(m.no)+'</td></tr>'+
  '<tr><td class="k">'+L('date')+'</td><td class="v">'+esc(m.date)+'</td></tr>'+
  (m.validity?'<tr><td class="k">'+L('validity')+'</td><td class="v">'+esc(m.validity)+'</td></tr>':'')+
  '</table></div></div><hr class="d-rule">'+
  '<div class="billto"><div class="cap">'+L('billto')+'</div><div class="co">'+esc(doc.client.co)+'</div>'+
  '<div class="ct">'+[doc.client.contact?L('contact')+': '+esc(doc.client.contact):'',doc.client.phone?L('phone')+': '+esc(doc.client.phone):'',doc.client.email?esc(doc.client.email):''].filter(Boolean).join('　·　')+'</div></div>'+
  '<table class="items"><tr><th class="n">'+L('no')+'</th><th>'+L('desc')+'</th><th class="q">'+L('qty')+'</th><th class="p">'+L('price')+'</th><th class="p">'+L('disc')+'</th><th class="a">'+L('amt')+'</th></tr>'+
  doc.items.map((it,i)=>'<tr><td class="n">'+(i+1)+'</td><td>'+esc(it.d)+'</td><td class="q">'+it.q+'</td><td class="p">'+money(it.p).replace('MOP ','')+'</td><td class="p">'+(it.disc||0)+'%</td><td class="a">'+money(lineAmt(it))+'</td></tr>').join('')+
  '</table>'+
  '<div class="d-totals"><div class="tot-box"><div class="tot-row grand"><span>'+L('total')+'</span><span>'+money(grandTotal())+'</span></div>'+
  (doc.showWords?'<div class="words">'+amtWords()+'</div>':'')+'</div></div>'+
  (doc.showPay?'<div class="d-pay"><div class="cap">'+L('pay')+'</div>'+
   (doc.pay.bank?'<div class="ln">'+L('bank')+': '+esc(doc.pay.bank)+'</div>':'')+
   (doc.pay.accname?'<div class="ln">'+L('accname')+': '+esc(doc.pay.accname)+'</div>':'')+
   (doc.pay.accno?'<div class="ln">'+L('accno')+': '+esc(doc.pay.accno)+'</div>':'')+
   (doc.pay.cheque?'<div class="ln">'+L('cheque')+': '+esc(doc.pay.cheque)+'</div>':'')+'</div>':'')+
  (doc.rmk?'<div class="d-rmk"><div class="cap">'+L('rmk')+'</div><div class="tx">'+esc(doc.rmk)+'</div></div>':'')+
  '<div class="d-sign"><div class="sign-box"><div class="sign-line">'+L('seller')+(doc.signName?'<br>'+esc(doc.signName):'')+'</div></div>'+
  (doc.showChop?'<div class="sign-box"><div class="chop">公司蓋章<br>CHOP</div><div class="sign-line" style="margin-top:8px">'+L('sign')+'</div></div>':'')+
  '<div class="sign-box"><div class="sign-line">'+(doc.lang==='zh'?'客戶簽署':doc.lang==='en'?'Client Signature':'客戶簽署 Client')+'</div></div></div>'+
  '<div class="d-foot">Quo-mo · '+(doc.lang==='zh'?'澳門商業單據':'Macau Business Document')+'</div>';
 return '<div class="doc tpl'+c+'">'+(c===3||c===9?inner:'<div style="display:flex;flex-direction:column;flex:1">'+inner+'</div>')+'</div>';
}
function render(){
 $('preview').innerHTML=renderDoc();
 fitPreview(); saveDraft();
 // sync toolbar
 document.querySelectorAll('#docType button').forEach(b=>b.classList.toggle('on',b.dataset.v===doc.type));
 document.querySelectorAll('#docLang button').forEach(b=>b.classList.toggle('on',b.dataset.v===doc.lang));
 document.querySelectorAll('.tplcard').forEach((el,i)=>el.classList.toggle('on',TPLS[i].c===doc.tpl));
}
function fitPreview(){
 const w=$('pvscale').parentElement.clientWidth||700;
 const k=Math.min(1,w/794);
 $('pvscale').style.transform='scale('+k+')';
 const ch=$('preview').firstChild;
 $('pvscale').style.height=((ch?ch.offsetHeight:1123)*k)+'px';
}
/* ================= editor ================= */
function F(label,inner){return '<div class="frow"><label>'+label+'</label>'+inner+'</div>';}
function I(key,val,ph){return '<input data-k="'+key+'" value="'+esc(val).replace(/"/g,'&quot;')+'" placeholder="'+(ph||'')+'">';}
function buildEditor(){
 const s=doc.seller,m=doc.meta,cl=doc.client,p=doc.pay;
 $('editor').innerHTML=
 '<h3>'+T('seller')+'</h3>'+
 F('公司名稱 (中)',I('seller.name_zh',s.name_zh))+F('公司名稱 (英)',I('seller.name_en',s.name_en))+
 F('地址',I('seller.addr',s.addr))+
 '<div class="f2">'+F('電話',I('seller.phone',s.phone))+F('電郵',I('seller.email',s.email))+'</div>'+
 '<div class="btnrow"><button class="btn small" id="bLogo">'+T('logo')+'</button><button class="btn small" id="bLogoClr">'+T('clear')+'</button></div><input type="file" id="fLogo" accept="image/*" style="display:none">'+
 '<h3>'+T('meta')+'</h3>'+
 '<div class="f2">'+F('單據編號 No.',I('meta.no',m.no))+F('日期 Date', '<input type="date" data-k="meta.date" value="'+m.date+'">')+'</div>'+
 F('有效期至 Validity (可選)', '<input type="date" data-k="meta.validity" value="'+m.validity+'">')+
 '<h3>'+T('client')+'</h3>'+
 F('客戶公司',I('client.co',cl.co))+F('聯絡人',I('client.contact',cl.contact))+
 '<div class="f2">'+F('電話',I('client.phone',cl.phone))+F('電郵',I('client.email',cl.email))+'</div>'+
 '<h3>'+T('items')+'</h3><div id="itemList">'+
 doc.items.map((it,i)=>'<div class="itemrow" data-i="'+i+'"><button class="del" data-del="'+i+'">×</button>'+
   F('描述', '<textarea data-ik="d" data-i="'+i+'">'+esc(it.d)+'</textarea>')+
   '<div class="f3">'+F('數量','<input type="number" min="0" data-ik="q" data-i="'+i+'" value="'+it.q+'">')+F('單價','<input type="number" min="0" step="0.01" data-ik="p" data-i="'+i+'" value="'+it.p+'">')+F('折扣%','<input type="number" min="0" max="100" data-ik="disc" data-i="'+i+'" value="'+(it.disc||0)+'">')+'</div></div>').join('')+
 '</div><button class="btn small" id="bAdd">'+T('add')+'</button>'+
 '<h3>'+T('total')+'</h3>'+
 F('','<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" data-c="showWords" '+(doc.showWords?'checked':'')+' style="width:auto"> 大寫金額 Amount in words</label>')+
 '<h3>'+T('pay')+'</h3>'+
 F('','<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" data-c="showPay" '+(doc.showPay?'checked':'')+' style="width:auto"> 顯示此欄</label>')+
 F('銀行',I('pay.bank',p.bank))+F('帳戶名稱',I('pay.accname',p.accname))+
 F('帳號',I('pay.accno',p.accno))+F('支票抬頭',I('pay.cheque',p.cheque))+
 '<h3>'+T('rmk')+'</h3>'+
 F('備註','<textarea data-k="rmk">'+esc(doc.rmk)+'</textarea>')+
 F('簽署人姓名','<input data-k="signName" value="'+esc(doc.signName).replace(/"/g,'&quot;')+'">')+
 F('','<label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" data-c="showChop" '+(doc.showChop?'checked':'')+' style="width:auto"> 公司蓋章欄</label>');
 // bindings
 $('editor').querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{setPath(el.dataset.k,el.type==='checkbox'?el.checked:el.value);});
 $('editor').querySelectorAll('[data-ik]').forEach(el=>el.oninput=()=>{const it=doc.items[+el.dataset.i];it[el.dataset.ik]=el.type==='number'?+el.value:el.value;render();});
 $('editor').querySelectorAll('[data-c]').forEach(el=>el.onchange=()=>{doc[el.dataset.c]=el.checked;render();});
 $('editor').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(doc.items.length>1){doc.items.splice(+b.dataset.del,1);buildEditor();render();}});
 $('bAdd').onclick=()=>{doc.items.push({d:'',q:1,p:0,disc:0});buildEditor();render();};
 $('bLogo').onclick=()=>$('fLogo').click();
 $('bLogoClr').onclick=()=>{doc.seller.logo='';render();};
 $('fLogo').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{doc.seller.logo=r.result;render();};r.readAsDataURL(f);};
}
function setPath(k,v){const ks=k.split('.');let o=doc;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;render();}
document.querySelectorAll('#docType button').forEach(b=>b.onclick=()=>{doc.type=b.dataset.v;render();});
document.querySelectorAll('#docLang button').forEach(b=>b.onclick=()=>{doc.lang=b.dataset.v;render();});
/* ================= template strip ================= */
function buildStrip(){
 $('tstrip').innerHTML=TPLS.map((t,i)=>'<div class="tplcard'+(t.c===doc.tpl?' on':'')+'" data-t="'+t.c+'"><div class="thumb">'+renderDoc().replace('tpl'+doc.tpl,'tpl'+t.c)+'</div><div class="nm">'+t.n+'</div></div>').join('');
 $('tstrip').querySelectorAll('.tplcard').forEach(el=>el.onclick=()=>{doc.tpl=+el.dataset.t;buildStrip();render();});
}
/* ================= export ================= */
function docStyles(){
 // extract doc-related CSS for standalone export
 const css=[];for(const sh of document.styleSheets){try{for(const r of sh.cssRules){const t=r.cssText;if(/\.doc|\.d-|\.seller|\.logo|\.meta|\.billto|table\.items|\.tot|\.words|\.sign|\.chop/.test(t))css.push(t);}}catch(e){}}
 return css.join('\n');
}
function standaloneHTML(){
 return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff}'+docStyles()+'</style></head><body>'+renderDoc()+'</body></html>';
}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();}
function exportImg(type){
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><foreignObject width="794" height="1123">'+
  '<div xmlns="http://www.w3.org/1999/xhtml" style="width:794px;height:1123px">'+standaloneHTML().replace(/<!DOCTYPE html>|<\/?html>|<\/?head>|<meta[^>]*>|<\/?body>/g,'')+'</div></foreignObject></svg>';
 const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
 const img=new Image();
 img.onload=()=>{const sc=2,cv=document.createElement('canvas');cv.width=794*sc;cv.height=1123*sc;
  const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
  URL.revokeObjectURL(url);
  const name='quomo-'+doc.type+'-'+doc.meta.no+'.'+type;
  if(type==='jpg')download(cv.toDataURL('image/jpeg',0.92),name);else cv.toBlob(b=>download(URL.createObjectURL(b),name),'image/png');};
 img.onerror=()=>alert('Export failed, please try Print/PDF');
 img.src=url;
}
$('bPng').onclick=()=>exportImg('png');
$('bJpg').onclick=()=>exportImg('jpg');
$('bPdf').onclick=()=>window.print();
/* ================= save / load ================= */
$('bSave').onclick=()=>{download(URL.createObjectURL(new Blob([JSON.stringify(doc)],{type:'application/json'})),'quomo-'+doc.type+'-'+doc.meta.no+'.json');};
$('bLoad').onclick=()=>$('fLoad').click();
$('fLoad').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{doc=Object.assign(blankDoc(),JSON.parse(r.result));buildEditor();buildStrip();render();}catch(err){alert('Invalid file');}};r.readAsText(f);};
/* ================= boot ================= */
applyTheme(); buildChrome(); buildEditor(); buildStrip(); render();
window.addEventListener('resize',fitPreview);
/* mobile tabs */
document.querySelectorAll('#mtabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#mtabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelector('.work').dataset.mtab=b.dataset.mtab;
  fitPreview();
  window.scrollTo(0,0);
});
</script>
</body>
